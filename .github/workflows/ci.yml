name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: python3 -m unittest scripts/test_check_solutions.py
      - run: npm run check:solutions
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api,mailpit,supavisor
      - run: supabase test db
