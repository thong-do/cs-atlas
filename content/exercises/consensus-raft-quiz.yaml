slug: consensus-raft-quiz
type: quiz
title: "Consensus with Raft — quiz"
lessons: [consensus-raft]
ladderOrder: 1
questions:
  - id: vote-decision
    prompt: "A candidate asks for a vote in term 7. Its last log entry is from term 4 at index 6. The voter has not yet voted in term 7, and its own last entry is from term 3 at index 11. What does the voter do?"
    choices: ["Rejects it, because its own log is longer and so holds more committed entries", "Rejects it, because a vote is only granted to the node with the highest index", "Grants the vote, because the candidate's last log term is higher, which outranks length", "Grants the vote, because it has not voted in term 7 and any candidate with a newer term wins"]
    answer: 2
    explanation: "A voter compares the term of the last entry first and the length only on a tie, so the term-4 log is more up to date. The two rejections rank by length alone, and a free vote is not enough, since the log check still applies."
  - id: six-nodes
    prompt: "A team runs a 5-node cluster and adds a sixth node, expecting it to survive more failures. What is the effect?"
    choices: ["Tolerance rises to 3 failures, since 6 nodes still leave 3 survivors to vote", "Tolerance stays at 2, but commits get faster since a sixth replica shares the load", "Tolerance falls to 1, since the majority of 6 is 4 and an even-sized cluster can never split its votes", "Tolerance stays at 2, but a majority is now 4, so each commit needs one more acknowledgement"]
    answer: 3
    explanation: "A majority of 6 is 4, so the cluster tolerates ⌊5/2⌋ = 2 failures, the same as 5 nodes. The extra node costs one more acknowledgement per commit and speeds nothing up."
  - id: stale-leader-read
    prompt: "A network fault isolates the old leader from the other four nodes of a five-node cluster. The four elect a new leader in a higher term. A client still connected to the old leader asks for a value. Which design returns a safe answer?"
    choices: ["Return the old leader's local state, since it was elected by a majority in its term", "Have the leader confirm with a majority first, as ReadIndex does; the isolated one cannot, so it declines", "Return the state of the follower closest to the client, since a follower is never behind a stepped-down leader", "Return the old leader's state if its last heartbeat was recent, with no further check, since clocks are synchronized"]
    answer: 1
    explanation: "A read is only linearizable if the node confirms it is still leader, and the isolated one cannot reach a majority. Local state may miss newer commits, a follower can lag, and a heartbeat-age rule is a lease that relies on bounded clock drift."
  - id: scaling-writes
    prompt: "A 3-node Raft group handles 2,000 writes/s and is near its limit. An engineer moves it to 7 nodes to double capacity. What should they expect?"
    choices: ["No gain: every write still goes through one leader and waits for 4 acks; it does tolerate 3 failures", "About 7/3 times the write rate, since the extra followers share the work of appending entries to the log", "Double throughput once reads are sent to followers, since reads and writes share the same log", "Lower latency, since with more nodes it is likelier that a fast replica acknowledges each write"]
    answer: 0
    explanation: "Adding voters raises fault tolerance but the leader still orders every write, and a majority of 7 is 4, so commits wait on a larger group. Throughput scales by splitting the data across independent groups."
  - id: partitioned-leader-writes
    prompt: "In a 5-node cluster, the leader and one follower are cut off from the other three. For a while the leader keeps accepting client writes. After the network heals, what happens to those writes?"
    choices: ["They are merged into the new leader's log in timestamp order, so no client write is lost", "They were never committed (only 2 of 5 nodes stored them), so the new leader's log overwrites them", "They are kept, because the old leader's term was still valid when it appended them, so the new leader adopts them", "They were committed on the old leader and are replayed to the other nodes once the network heals"]
    answer: 1
    explanation: "Committing needs 3 of 5 nodes, and only 2 stored these entries, so the old leader never answered them as committed. Once it sees the higher term it steps down, and the conflicting entries are overwritten; Raft does no timestamp merge."
flashcards:
  - id: consensus-goal
    front: "What does consensus give a cluster?"
    back: "Agreement on one ordered log of commands despite crashes. Replaying the same log gives every node the same state: a replicated state machine."
  - id: raft-terms
    front: "Raft terms"
    back: "Numbered periods with at most one leader. A node seeing a higher term adopts it, and a stale leader steps down."
  - id: raft-election
    front: "How does a Raft election work?"
    back: "A follower whose timeout expires becomes a candidate, bumps its term and asks for votes. Each node votes once per term; a majority wins."
  - id: election-restriction
    front: "Raft election restriction"
    back: "A voter rejects a candidate with a less up-to-date log: compare the last entry's term first, then log length. Winners hold all committed entries."
  - id: append-entries-check
    front: "AppendEntries consistency check"
    back: "The request carries the previous index and term. A follower lacking that entry rejects it, and the leader backs up and resends until the logs match."
  - id: raft-commit
    front: "When is a Raft entry committed?"
    back: "Once a majority of nodes has stored it. A leader commits entries from older terms only indirectly, by committing one from its own term."
  - id: failure-tolerance
    front: "Failures tolerated by N nodes"
    back: "⌊(N−1)/2⌋. Three nodes tolerate 1, five tolerate 2, and four tolerate 1 (same as three), so even sizes add no tolerance."
  - id: linearizable-raft-reads
    front: "Linearizable reads in Raft"
    back: "Via the leader: ReadIndex confirms leadership with a heartbeat round, or a leader lease, which assumes bounded clock drift. Follower reads can be stale."
