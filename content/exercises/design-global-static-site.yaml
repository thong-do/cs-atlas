slug: design-global-static-site
type: design-prompt
title: "Design: serve a marketing site worldwide"
lessons: [dns-cdn]
ladderOrder: 2
prompt: |
  A company's marketing site (about **40 HTML pages**, plus images, CSS and JavaScript totalling **~2 MB** per page view)
  gets **~2,000 page views per second** at peak, from users in **North America, Europe and Asia**.
  The origin is a single server in one US region.

  Targets: **p95 page load under 1.5 s on a first visit**, and **a deploy must be visible to users within 5 minutes**.
  Describe the DNS setup, what the CDN caches and for how long, how a deploy reaches users,
  and what you would measure.
hint: "Split the files into two kinds: names that never change meaning, and pages that point to them. Each needs a different TTL."
rubric:
  - id: cdn-front
    point: "Puts a CDN in front of the origin (www as a CNAME to it, apex via ALIAS/flattening or a redirect), so most requests are answered by a nearby edge."
  - id: asset-caching
    point: "Gives fingerprinted assets a very long max-age (e.g. one year, immutable) and HTML a short TTL or revalidation, so users get new pages without stale assets."
  - id: deploy-visibility
    point: "Makes deploys visible within 5 minutes: HTML TTL or s-maxage well under 5 minutes and/or a purge of changed pages after the deploy, with old assets kept available."
  - id: first-visit-latency
    point: "Explains how a first visit meets 1.5 s: nearby edge, few round trips (HTTP/2 or HTTP/3, TLS), compressed and small assets, and a warmed or shielded cache for misses."
  - id: measure
    point: "Measures cache hit ratio, origin request rate, p95 load or time to first byte per region, and DNS lookup time, and alerts on drops."
reference: |
  **DNS and edge.** Point `www` at the CDN with a CNAME (TTL around 300 s); handle the apex with the DNS
  provider's ALIAS/flattening or redirect it to `www`. The CDN's edges in North America, Europe and Asia
  answer most requests, so users do not wait for round trips to the US origin.

  **Caching.** Fingerprint every CSS, JS and image file (`app.3f9a1c.js`) and serve it with
  `Cache-Control: public, max-age=31536000, immutable`. Serve HTML with a short shared-cache lifetime,
  such as `max-age=0, s-maxage=60`, or `no-cache` with an ETag, so a changed page is picked up within a
  minute or so. Keep the cache key to path (and only the query parameters that matter).

  **Deploys.** Upload new assets first, then the new HTML. Purge the changed HTML URLs (or rely on the 60 s
  s-maxage). Old assets stay available so pages already open keep working. Total time to visibility is
  well under the 5-minute target, even allowing for slow purges.

  **First visit.** A miss costs one trip to the origin per edge location, then everything is a hit. Use an
  origin shield or tiered cache so only one edge location per region fetches from the origin. With HTTP/2 or
  HTTP/3, TLS 1.3, Brotli or gzip, and sized images, the network part is short. Transfer time still depends on bandwidth (2 MB is roughly 0.8 s at 20 Mbps, more on slow mobile), so keep the critical path small: render-blocking CSS/JS first, compressed, and images lazy-loaded below the fold.

  **Load.** At 2,000 views/s with a 95%+ hit ratio on HTML and nearly 100% on assets, the origin load is tiny: with
  `s-maxage=60` and an origin shield, each of the ~40 pages is revalidated about once a minute (under one request
  per second), plus misses for new assets after a deploy. A spike mostly lands on the edge.

  **Measure.** Hit ratio, origin requests/s, p95 load time and time to first byte by region, DNS lookup time,
  and error rates. Alert if the hit ratio drops: it often means a changed cache key or headers.
