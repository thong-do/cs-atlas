slug: design-message-store-sharding
type: design-prompt
title: "Design: shard a user-messages store"
lessons: [replication-sharding]
ladderOrder: 2
prompt: |
  A messaging product keeps a **user-messages table**: **4 TB today**, growing about **50 GB/day**.
  It serves **30,000 reads/s** and **3,000 writes/s**. Users open their conversations **newest first**.
  A single database node can no longer keep up with the writes or the storage.

  **One region must survive the loss of a database node** without losing acknowledged messages.
  Describe the partition key, the partitioning scheme, replication and failover, how you add capacity later,
  and how you handle a few extremely active users. Show the capacity arithmetic.
hint: "Write down the key the 'newest first' query filters on, then check what happens to your busiest value of that key."
rubric:
  - id: partition-key
    point: "Picks a partition key matching the main query (such as user_id, with messages sorted newest first inside it), so a conversation read hits one shard."
  - id: scheme
    point: "Chooses hash partitioning into many fixed buckets mapped to servers (or consistent hashing with virtual nodes), and avoids a monotonic key such as time or an auto-increment id."
  - id: replication
    point: "Replicates each shard across nodes or zones, with at least one synchronous follower or a majority commit for durability, and plans failover with fencing so only one leader writes."
  - id: capacity
    point: "Does the arithmetic: yearly growth, shard count, per-shard storage and per-shard read and write rates, with headroom."
  - id: hot-users
    point: "Handles very active users by salting the routing keys of flagged hot users (for example hash(user_id, salt) with salt = hash(message_id) mod k, and salt 0 for everyone else, so older rows stay reachable) so writes spread, fanning newest-first reads out to the k sub-keys and merging, plus caching or limits. Notes that a time bucket alone only bounds partition size."
reference: |
  **Key and scheme.** Partition by `user_id`, sorting rows by `(conversation_id, sent_at DESC)` inside the
  partition, so opening a conversation newest first reads one shard in order. Route every row by
  `hash(user_id, salt)` into a fixed number of logical buckets (say 256) mapped to servers, with `salt = 0`
  for normal users, so a user's rows normally sit together. Never partition by `sent_at`: every new
  message would hit the newest range.

  **Capacity.** Growth is 50 GB/day × 365 ≈ 18 TB/year, so about 22 TB after a year (4 + 18).
  At an illustrative 1.5 TB per node, 22 ÷ 1.5 ≈ 15, so plan 16 shards (about 250 GB each today, 1.4 TB
  after a year). Per shard: 3,000 ÷ 16 ≈ 190 writes/s and 30,000 ÷ 16 ≈ 1,900 reads/s, which one leader handles; keep skew headroom.

  **Replication and failover.** Each shard has a leader and two followers in different zones. A write
  acknowledges once the leader and one synchronous follower have it, so losing one node loses no
  acknowledged message. Reads can use followers; a user's own recent reads use the leader. If the leader
  dies, a majority election promotes the up-to-date follower, and a fencing token stops the old leader
  writing if it returns.

  **Adding capacity.** Add servers and move whole buckets in the background, then switch the routing table.

  **Very active users.** A time bucket such as `(user_id, month)` only bounds partition size: the current
  month still takes all the heat. Instead flag hot users and give their new rows
  `salt = hash(message_id) mod k`, with k around 16, so writes spread over several logical buckets. Rows from before the flag stay at salt 0, which is one of the k sub-keys. Newest-first
  reads fan out to the k sub-keys and merge, and the flag must stay until old sub-keys are drained. Also cache the first page.

  **Trade-offs.** Cross-user queries need a copy per mailbox or an index, which adds writes. Watch per-shard size, write rate and replication lag.
