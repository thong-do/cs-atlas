slug: design-orders-and-activity-storage
type: design-prompt
title: "Design: storage for orders and an activity stream"
lessons: [sql-vs-nosql]
ladderOrder: 2
prompt: |
  A shop needs storage for two workloads.

  **(a) Orders and payments.** About **100 orders/s** at peak, each with several line items,
  a payment and a stock update. A payment must never be recorded without its order. Finance runs
  new report questions every month.

  **(b) Product-view activity stream.** **20,000 events/s** (roughly 1.7 billion a day), each
  about 200 bytes. The only read is "the **last 50 events for a user**", which must return in
  under 50 ms. Events older than 90 days can be dropped.

  Choose a store for each, and justify the choice. Describe the data layout, how each workload
  scales, and which consistency you need.
hint: "Write down the exact reads and the write rate for each workload first, then ask which store makes those cheap."
rubric:
  - id: orders-sql
    point: "Chooses a relational database (such as Postgres) for orders and payments, citing relationships, constraints and ad-hoc reporting."
  - id: transaction
    point: "Wraps order, payment and stock changes in one ACID transaction so they apply together or not at all."
  - id: activity-layout
    point: "Models the stream around its one read: partition (or key) by user, rows sorted newest first, so 'last 50' is one ordered read."
  - id: write-scaling
    point: "Does the arithmetic and scales writes: 20,000/s × 200 B ≈ 4 MB/s, spread across many partitions or nodes; orders at 100/s fit one tuned primary plus replicas."
  - id: tradeoffs
    point: "States the trade-offs: the activity store loses cheap ad-hoc queries and may be eventually consistent, which is acceptable; TTL or retention handles the 90-day drop."
reference: |
  **(a) Orders and payments: Postgres.** The data is relational (customers, orders, items,
  payments), with constraints and multi-row invariants. Place an order in one transaction:
  decrement stock with a conditional update, insert the order and items, and record the payment
  intent. If any step fails, everything rolls back. 100 orders/s is well within one tuned
  primary; add read replicas for dashboards and reports (accepting some replica lag), and index
  `customer_id` and `created_at`. A relational store also keeps finance's new questions cheap,
  as they are just new queries.

  **(b) Activity stream: wide-column or key-value.** One known read suggests designing the
  table around it. In Cassandra terms: partition key `user_id`, clustering key `event_time`
  descending, so "last 50" reads the head of one partition. At 20,000 events/s of about 200 B,
  ingest is roughly 4 MB/s, or about 350 GB a day before replication, and about 31 TB over
  90 days. Spread across many nodes that is routine for such a store. Set a TTL of 90 days so old
  rows expire, and bucket by day or week if a single user's partition could grow too large.
  DynamoDB with the same keys is an equivalent choice.

  **Trade-offs.** The stream gives up joins and ad-hoc queries; run analytics from a copy in
  a warehouse. Eventual consistency, or reading at a modest consistency level, is fine because
  a view event appearing a second late harms nobody. Orders need strong consistency, which
  the relational primary provides.
