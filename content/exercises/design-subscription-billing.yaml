slug: design-subscription-billing
type: design-prompt
title: "Design: subscription billing"
lessons: [payment-system]
ladderOrder: 2
prompt: |
  A SaaS company bills **3 M subscribers** through a payment provider: **80% on monthly plans** and the rest on
  **annual plans**. Renewals cluster: about **40% of monthly renewals fall on the 1st of the month**. Customers
  **upgrade and downgrade mid-cycle**, and about **6% of renewal charges fail** at the first try (expired cards,
  insufficient funds). Finance needs invoices that **never charge a customer twice** for a period, and a
  **monthly revenue report**. All numbers are illustrative.

  Describe how renewals are scheduled and spread, how a failed renewal is retried and when access is cut off,
  how mid-cycle plan changes are billed, how double charges are prevented, and the load on the 1st of the month.
  Show the arithmetic.
hint: "Work out how many charges the 1st brings, then ask what happens on the 1st if the provider times out on one of them."
rubric:
  - id: renewal-scheduling
    point: "Schedules renewals from an index on the next due date feeding a job queue, not a single cron loop; anchors new subscriptions to their sign-up date, and shows the 1st-of-month arithmetic spread over a stated window (2.4 M × 40% = 960,000 charges, about 22/s over 12 hours)."
  - id: dunning
    point: "Retries a failed renewal on a schedule over days (for example days 1, 3, 5 and 7, illustrative), uses card-updater services where the provider offers them (hedged), emails the customer, and suspends access only after a stated grace period."
  - id: proration
    point: "Prorates a mid-cycle change: credits the unused time on the old plan and charges the new plan for the rest of the period, either at once or on the next invoice, in integer minor units."
  - id: no-double-charges
    point: "Allows one open invoice per subscription and period through a unique constraint, sends an idempotency key per invoice attempt, and after a timeout looks the charge up before retrying."
  - id: immutable-invoices
    point: "Treats invoices as immutable records, correcting them with credit notes, and derives the monthly revenue report from them, spreading annual plans over their months."
reference: |
  **Scheduling.** 3 M × 80% = 2.4 M monthly and 600,000 annual subscribers. Each subscription stores its next due
  date, indexed; a scheduler enqueues due invoices as jobs for workers, rather than one cron loop over every customer.
  The 1st brings 2.4 M × 40% = 960,000 charges. Spread over 12 hours: 960,000 ÷ 43,200 s ≈ 22 charges/s. The other
  1.44 M monthly renewals average 48,000 a day over 30 days, and annual ones 600,000 ÷ 365 ≈ 1,644 a day. New
  subscriptions renew on their sign-up date, so the peak shrinks over time.

  **Dunning.** 960,000 × 6% = 57,600 failures on the 1st. Retry on days 1, 3, 5 and 7 (illustrative), refresh
  expired cards through card-updater services where the provider and networks support them, email the customer to
  update the card, and suspend access only after a 7-day grace period.

  **Proration.** An upgrade from a 1,000 to a 3,000 minor-unit monthly plan halfway through a 30-day period credits
  15/30 × 1,000 = 500 and charges 15/30 × 3,000 = 1,500, net 1,000, charged now; a downgrade's credit goes on the
  next invoice.

  **No double charges.** A unique constraint on (subscription_id, period_start) allows one invoice per period. Each
  charge attempt sends the key `invoice_id:attempt_n` to the provider. After a timeout the invoice is marked unknown,
  and the provider is queried with that key before any new attempt.

  **Invoices.** An issued invoice never changes; corrections are credit notes. The revenue report is computed from
  invoices and credit notes; an annual invoice is typically recognised as 1/12 per month, following the company's
  accounting rules.
