slug: design-tile-cache-placement
type: design-prompt
title: "Design: place keys in a map-tile cache"
lessons: [consistent-hashing]
ladderOrder: 2
prompt: |
  A map service keeps rendered tiles in an in-memory cache of **24 nodes with 128 GB each**, now about 90% full.
  It serves **360,000 tile reads/s** at a **97% hit ratio**; every miss goes to renderers that manage at most
  **45,000 renders/s**. Clients pick the cache node for a tile themselves, with no proxy in between.

  For a large event you are adding **4 nodes with 256 GB each**. One node serves about **40,000 reads/s**,
  and a few tiles around the venue may draw **25,000 reads/s each**.

  Describe the placement scheme, how the bigger nodes get a fair share, how much of the cache moves when you grow
  (compare `hash mod N`), how to grow without overloading the renderers, whether tiles need a second copy, and what
  to do about the venue tiles. Show the arithmetic.
hint: "Work out the miss rate the renderers would see if all four nodes joined at once, then for one node at a time."
rubric:
  - id: placement
    point: "Uses consistent hashing with virtual nodes (or rendezvous hashing), with every client on the same hash, vnode naming and membership list, and shows that hash mod N from 24 to 28 nodes would move about 6 in 7 tiles."
  - id: weights
    point: "Gives each 256 GB node twice the virtual nodes of a 128 GB node, so the new nodes take 8 of 32 weight units, about 25% of the tiles, and notes that this also gives a big node twice the traffic, since memory adds no throughput."
  - id: gradual-growth
    point: "Computes that adding all four at once drops the hit ratio to about 73% and sends about 98,000 misses/s to renderers that manage 45,000, and instead adds one node at a time (about 37,700 misses/s per step), letting each warm up, or ramps its weight."
  - id: copies
    point: "Checks a node failure: losing one of 24 nodes gives about 25,000 misses/s, within renderer capacity, so a single copy is acceptable for a cache; a second copy would double memory and would go on a different node and zone."
  - id: hot-tiles
    point: "Notes that consistent hashing cannot split one hot key: after growth a 256 GB node, holding twice the virtual nodes, already serves about 22,500 reads/s (360,000 × 2/32), so a 25,000 reads/s venue tile there reaches 47,500, over its 40,000 limit (36,250 on a 128 GB node). Hot tiles are replicated to several nodes, cached on clients or a CDN, or capped with bounded loads."
reference: |
  **Placement.** A ring with virtual nodes: 100 positions per 128 GB node, 200 per 256 GB node. Clients share the
  hash function, the vnode names and one membership list (from config or a coordination service), or they will send
  the same tile to different nodes. `hash mod N` from 24 to 28 nodes keeps a tile only when `h mod 24 == h mod 28`,
  which holds for 24 of every 168 values, so about 6 in 7 tiles would move: the hit ratio would fall to about
  0.97 × 1/7 ≈ 14%, about 310,000 misses/s.

  **Weights and movement.** Weight units: 24 × 1 + 4 × 2 = 32. The new nodes take 8 ÷ 32 = 25% of tiles; nothing else
  moves. Weighting by memory also weights traffic: a big node gets twice the reads of a small one.

  **Growing safely.** All four at once: hit ratio ≈ 0.97 × 0.75 ≈ 73%, so 360,000 × 0.27 ≈ 98,000 misses/s, more than
  twice what renderers manage. One 256 GB node: it takes 2 ÷ 26 ≈ 7.7%, hit ratio ≈ 0.97 × 24/26 ≈ 89.5%, about
  37,700 misses/s, which fits. Add it, wait until misses fall back near 10,800/s (3% of 360,000), then add the next.
  Ramping a node's virtual nodes in steps gives finer control.

  **Copies.** Today each node serves 360,000 ÷ 24 = 15,000 reads/s. Losing one node: hit ratio ≈ 0.97 × 23/24 ≈ 93%,
  about 25,000 misses/s, within 45,000. After growth, losing a 256 GB node: 0.97 × 30/32 ≈ 90.9%, about 32,600
  misses/s, still within. So one copy is enough; the renderers are the backup. If a second copy were
  needed, it would go on the next distinct node in another zone, at twice the memory.

  **Venue tiles.** After growth a 128 GB node serves 360,000 × 1/32 ≈ 11,250 reads/s and a 256 GB node twice that,
  22,500, since memory weights traffic too. A 25,000 reads/s tile on a big node makes 47,500 reads/s, over the 40,000
  limit; on a small one 36,250, with little headroom. Replicate the
  few hot tiles to several nodes and pick one at random, cache them on clients or a CDN with a short TTL, or use
  bounded loads so overflow goes to the next node.
