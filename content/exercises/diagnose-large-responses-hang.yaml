slug: diagnose-large-responses-hang
type: design-prompt
kind: diagnose
title: "Diagnose: the responses that stop at 1.4 KB"
lessons: [tcp-ip-stack]
ladderOrder: 2
prompt: |
  A team moves its services onto an overlay network that wraps every packet in a VXLAN header, which adds **50 bytes**. The physical
  network's MTU is **1,500**, and the hosts' interfaces were left at an MTU of **1,500**. A firewall between the racks drops
  all ICMP.

  Health checks and small JSON calls succeed. Any response larger than about **1.4 KB** hangs until the client's **30 s** timeout.
  SSH logs in, but running `cat` on a large file freezes the session.

  Explain why only large packets fail, and work out the usable MTU and the matching IPv4 TCP MSS. Explain why the hosts never
  adapt to the smaller packet size on their own. Show how you would confirm the cause from a host, and propose fixes with
  their trade-offs.
hint: "Ask what the host does with a 1,500-byte packet once the overlay adds its header, and who is supposed to tell the sender."
rubric:
  - id: why-large
    point: "Explains why only large packets fail: a packet the host sends at its 1,500-byte MTU grows by the 50-byte overlay header past the physical 1,500, so it cannot cross, while small packets (handshakes, health checks, short JSON, SSH keystrokes) still fit."
  - id: arithmetic
    point: "Computes the usable MTU, 1,500 - 50 = 1,450, and the matching IPv4 TCP MSS, 1,450 - 20 - 20 = 1,410, versus the 1,460 the hosts assume."
  - id: pmtud
    point: "Explains path MTU discovery: packets are sent with the don't-fragment bit set, and a device that cannot forward one sends back an ICMP 'fragmentation needed' message with the next-hop MTU; the firewall drops those, so the sender never learns, keeps retransmitting the same size, and the connection black-holes."
  - id: confirm
    point: "Shows how to confirm it: `ping -M do -s <size>` on Linux (don't fragment; size is payload plus 28 bytes of IP and ping headers) to a peer on the same rack over the overlay, so the firewall is not in the path, where 1,422 + 28 = 1,450 passes and 1,423 fails; a packet capture showing retransmitted full-size segments is a second check."
  - id: fixes
    point: "Gives fixes with trade-offs: allow ICMP type 3 code 4 (the real fix, narrow), lower the interface MTU to 1,450 (simple, must reach every host), clamp the MSS to 1,410 at the edge (fixes TCP only, not UDP), or raise the physical MTU to at least 1,550 (needs every device on the path to agree)."
reference: |
  **Why only large packets fail.** Hosts send up to 1,500 bytes, but the overlay adds 50, so a full-size packet becomes 1,550 bytes and exceeds the physical 1,500 MTU. Small packets fit: handshakes, health checks, short JSON and SSH keystrokes. A large response is sent in full-size segments, and every one is dropped.

  **Arithmetic.** Usable MTU = 1,500 - 50 = 1,450. IPv4 TCP MSS = 1,450 - 20 (IP) - 20 (TCP) = 1,410, not the 1,460 that a 1,500 MTU gives. That is why responses beyond about 1.4 KB hang.

  **Path MTU discovery.** On most OSes TCP sends with the don't-fragment bit set by default. A device that cannot forward the packet drops it and returns an ICMP type 3 code 4 "fragmentation needed" message carrying the next-hop MTU, and the sender lowers its packet size. The firewall drops that ICMP, so the sender hears nothing, retransmits the same size until the 30 s timeout, and the path is a black hole.

  **Confirm.** Ping a peer on the same rack over the overlay, where the firewall is not in the path: `ping -M do -s 1422 <peer>` passes (1,422 + 28 = 1,450) and `-s 1423` fails (1,451). A capture shows full-size segments retransmitted with no replies.

  **Fixes.**
  - Allow ICMP type 3 code 4: fixes the root cause and keeps full discovery; costs a firewall rule.
  - Set the interface MTU to 1,450: hosts then use MSS 1,410. Simple, but must be applied everywhere.
  - Clamp the MSS to 1,410 at the edge: rewrites the TCP handshake, so it covers TCP only, not UDP.
  - Raise the physical MTU to at least 1,500 + 50 = 1,550: keeps 1,500-byte packets but every switch and router must agree.
