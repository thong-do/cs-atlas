slug: diagnose-shared-mutation
type: design-prompt
kind: diagnose
title: "Diagnose: the response with someone else's items"
lessons: [data-in-memory]
ladderOrder: 2
prompt: |
  After a refactor, about **1%** of API responses at **200 requests/s** contain items that belong to another user, and some users
  also report their own items missing.
  The refactor builds one response object at startup and copies it with a shallow copy for each request:

  ```python
  TEMPLATE = {"user": None, "items": []}

  async def handle(user):
      resp = dict(TEMPLATE)          # shallow copy per request
      resp["user"] = user.id
      async for it in load_items(user):   # cache hit: no yield; miss: awaits the DB
          resp["items"].append(it)
      body = serialize(resp)
      TEMPLATE["items"].clear()      # "reset" after sending
      return body
  ```

  About **1.5%** of calls miss the in-process cache and await the database for about **5 ms**; cache hits never yield.
  Explain the bug in terms of references, and why it is intermittent and depends on concurrency. Say how you would
  confirm the cause. Propose fixes (a deep copy, an immutable template, or building a fresh object per request) and
  the cost of each.
hint: "Ask what `dict(TEMPLATE)` duplicates, and whether `resp[\"items\"]` and `TEMPLATE[\"items\"]` are the same list."
rubric:
  - id: reference-explained
    point: "Explains that the shallow copy duplicates only the top-level dict, so `resp[\"items\"]` is the same list object as `TEMPLATE[\"items\"]`; every request appends into one shared list."
  - id: intermittent-concurrency
    point: "Explains why it is intermittent: a lone request appends then clears, so it looks right, and only requests whose lifetimes overlap (interleaved at an await on a cache miss) see each other's items; the leak rate grows with request rate and handler duration."
  - id: arithmetic
    point: "Gives a rough rate: 1% of 200 requests/s is about 2 leaked responses per second (7,200 per hour), consistent with 3 misses per second each yielding 5 ms, where P(at least one arrival) is 1 − e^-1 ≈ 0.63, giving ≈ 1.9/s; names the wiped own-items response as a separate symptom."
  - id: confirm
    point: "Confirms by checking identity (`resp[\"items\"] is TEMPLATE[\"items\"]` or equal `id()` values) and by reproducing with concurrent test requests that tag items by user."
  - id: fixes-and-costs
    point: "Names the fixes with costs: deep copy (correct but copies all nested data per request), immutable template (no copying but needs discipline or frozen types), fresh object per request (simplest, a small allocation each time)."
reference: |
  **Cause.** `dict(TEMPLATE)` copies the top-level mapping only. Its values are references, so
  `resp["items"]` and `TEMPLATE["items"]` name the same list, and every request appends to it.

  **Intermittent.** A request that never yields (a cache hit) appends, serializes and clears without interruption,
  so it is correct. On a cache miss, request A awaits the database while its items sit in the shared list. A request B
  that arrives meanwhile appends its own items, serializes A's items too (the leak), then clears the list. That
  clear is the second symptom: A resumes with its earlier items wiped, so A's response is missing items rather than
  leaking. Only the first arrival in the window sees A's items, because it clears the list. The bug needs overlap, so
  it grows with request rate and miss time.

  **Arithmetic.** Misses: 200 × 0.015 = 3 per second. Arrivals in A's 5 ms window: 200 × 0.005 = 1 on average, so
  P(at least one) = 1 − e^(−1) ≈ 0.63. Leaked responses ≈ 3 × 0.63 ≈ 1.9 per second, and 1.9 ÷ 200 ≈ 0.95%, about 1%.
  Per hour: 1.9 × 3,600 ≈ 6,800 (about 7,200 at exactly 1%). About as many A responses (≈1.9 per second) come back with items missing; those are not leaks.

  **Confirm.** Log `id(resp["items"])` and `id(TEMPLATE["items"])`, or assert `is`. Fire concurrent requests
  for different users with user-tagged items and check each response.

  **Fixes and costs.**
  - Deep copy per request: correct, but copies all nested data each time, so cost grows with template size.
  - Immutable template (tuple or frozen types): nothing shared is ever mutated, no copying, but the handler must
    build its own list and discipline is needed.
  - Fresh object per request: simplest and clear, one small allocation per request.
