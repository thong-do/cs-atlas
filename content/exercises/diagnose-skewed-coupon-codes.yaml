slug: diagnose-skewed-coupon-codes
type: design-prompt
kind: diagnose
title: "Diagnose: coupon codes with favourite characters"
lessons: [discrete-math-essentials]
ladderOrder: 2
prompt: |
  A shop issues **10-character coupon codes** from the **62-character alphabet** `A–Z a–z 0–9`. In **Python**, each character is
  `ALPHABET[os.urandom(1)[0] % 62]`, where `os.urandom(1)` returns **one fresh, cryptographically random byte** per character.

  A security review counts the characters across **1,000,000 issued codes** (**10,000,000 characters**). The team expected each
  character to appear about **161,000 times** (10,000,000 ÷ 62). Instead, the first 8 characters of the alphabet (`A` to `H`) each
  appear about **195,000 times**, and each of the other 54 appears about **156,000 times**. The source of random bytes is not
  suspected: it passes the usual randomness tests when read directly.

  Explain the skew. Show the arithmetic, including whether it matches the counts. Say how much it matters for the security of a
  10-character code, and how you would confirm the cause. Give fixes with their trade-offs.
hint: "Which of the 256 possible byte values land on each of the 62 positions?"
rubric:
  - id: cause
    point: "Explains that a byte has 256 values and 256 is not a multiple of 62, so mapping bytes to positions leaves a remainder: the first 8 positions receive one extra byte value each, while the random source itself is fine."
  - id: arithmetic
    point: "Shows 256 = 4 × 62 + 8: values 0–247 map evenly, 4 per position, and 248–255 add a fifth to positions 0–7. So P = 5/256 ≈ 1.95% against 4/256 ≈ 1.56% (ratio 1.25), and 10,000,000 × 5/256 ≈ 195,313 and × 4/256 = 156,250 match the counts; check 8 × 5 + 54 × 4 = 256."
  - id: impact
    point: "Quantifies the loss with H = −Σ p log2 p: about 5.9497 bits per character against log2 62 ≈ 5.9542, about 0.0045 bits less, roughly 0.045 bits per 10-character code. So the loss is small, but the bias is real and lets a guesser try the likelier characters first (hedged, approximate)."
  - id: confirm
    point: "Confirms with a frequency count of characters, a chi-square test against equal expected counts, or by reproducing the arithmetic over the 256 byte values."
  - id: fixes
    point: "Gives fixes with trade-offs: rejection sampling (discard bytes ≥ 248), which needs about 256/248 ≈ 1.03 bytes per character; `secrets.choice(ALPHABET)`, which is simple and safe; a 64-character alphabet, since 256 is divisible by 64, which changes the code format; or drawing a large random integer and converting its base, where the remaining bias is tiny but not zero unless the integer is uniform over 62^10."
reference: |
  **Cause.** A byte has 256 values, and 256 is not a multiple of 62. Mapping each byte to a position by remainder leaves 8 values over, which land on positions 0–7 (`A`–`H`). The random source is fine; the mapping is not even.

  **Arithmetic.** 256 = 4 × 62 + 8. Values 0–247 give each position 4 bytes, and 248–255 add a fifth to positions 0–7. Check: 8 × 5 + 54 × 4 = 40 + 216 = 256. So P = 5/256 ≈ 1.95% for `A`–`H` and 4/256 ≈ 1.56% for the rest, a ratio of 1.25. Over 10,000,000 characters, 10,000,000 × 5/256 ≈ 195,313 and 10,000,000 × 4/256 = 156,250, matching the counts. The expected 161,290 holds only for equal probabilities.

  **Impact.** With H = −Σ p log2 p, H = −[8 × (5/256) × log2(5/256) + 54 × (4/256) × log2(4/256)] ≈ 5.9497 bits per character, against log2 62 ≈ 5.9542, a loss near 0.0045 bits, about 0.045 bits per 10-character code. That is small, but the bias is real and a guesser can try likelier characters first. Treat the figures as approximate.

  **Confirm.** Count character frequencies, run a chi-square test against equal expected counts, or reproduce the arithmetic over the 256 byte values.

  **Fixes.**
  - **Rejection sampling:** discard bytes ≥ 248. Exactly uniform; costs about 256/248 ≈ 1.03 bytes per character.
  - **`secrets.choice(ALPHABET)`:** simple and safe, with no hand-written mapping.
  - **64-character alphabet:** 256 is divisible by 64, so no skew; the code format changes.
  - **Large random integer, converted to base 62:** the remaining bias is tiny but not zero, unless the integer is uniform over 62^10.
