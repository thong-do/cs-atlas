slug: diagnose-slow-login
type: design-prompt
kind: diagnose
title: "Diagnose: the login that got 3,000 times slower"
lessons: [query-planning]
ladderOrder: 2
prompt: |
  A **PostgreSQL** `users` table has **30,000,000 rows** and a **unique B-tree index on `email`**. The login query was
  `WHERE email = $1`. A deploy changed it to `WHERE lower(email) = lower($1)` so that logins ignore letter case.

  After the deploy, login **p50 went from 2 ms to about 6 s**. Database CPU sits at **100% on all 32 cores**, and logins have begun
  to **time out at the 10 s limit**. Peak login traffic is **50 per second**. No index was dropped and nothing else was deployed.

  Explain the slowdown. Estimate the work per login and show that the arithmetic matches the symptoms. Say how you would
  confirm the cause, and give fixes with their trade-offs.
hint: "Think about what order the index keeps its entries in, and whether it can help when the query asks about something other than those stored values."
rubric:
  - id: cause
    point: "Explains that the index orders the stored email values, so it cannot locate rows by lower(email); the planner has no usable index path and scans the whole table, testing every row."
  - id: per-login
    point: "Estimates the cost: about 30,000,000 rows ÷ 5,000,000 rows/s per core ≈ 6 s of CPU per login, against about 4 index page reads before."
  - id: capacity
    point: "Shows the capacity gap: 50 logins/s × 6 s = 300 core-seconds per second against 32 cores, about 9 times over capacity, so work queues, latency grows and requests hit the 10 s timeout."
  - id: confirm
    point: "Confirms with EXPLAIN (ANALYZE, BUFFERS) showing a Seq Scan on users with Filter: (lower(email) = ...) instead of an index scan, and pg_stat_statements showing the login query's mean and total time."
  - id: fixes
    point: "Gives fixes with trade-offs: roll back first; an index on lower(email) via CREATE INDEX CONCURRENTLY (slow, outside a transaction block, can leave an invalid index, UNIQUE only after checking for emails differing by case); citext (table rewrite and lock, same duplicate check); or a stored normalised column (backfill, write-path changes)."
reference: |
  **Cause.** The B-tree is sorted by the stored `email` values. A condition on `lower(email)` asks about different values, so the index cannot narrow the search. The planner has no usable index path, so it scans the table and tests every row.

  **Per login.** The old lookup needed about 4 index page reads (30 M keys need about 4 levels at an illustrative fan-out of 300). The scan reads 30,000,000 rows; at an illustrative 5,000,000 rows/s per core, 30,000,000 ÷ 5,000,000 = 6 s of CPU. That is service time before queueing; p50 rises as the queue grows (parallel workers may change it).

  **Capacity.** 50 logins/s × 6 s = 300 core-seconds of work per second. 32 cores supply 32. 300 ÷ 32 is about 9.4 times over capacity, so requests queue until they hit the 10 s timeout.

  **Confirm.** `EXPLAIN (ANALYZE, BUFFERS)` shows a Seq Scan on `users` with `Filter: (lower(email) = lower(...))`. `pg_stat_statements` shows the query's mean time jump from about 2 ms to seconds after the deploy.

  **Fixes.**
  - **Roll back first.** It restores 2 ms but loses case-insensitive login.
  - **Index on `lower(email)`:** `CREATE INDEX CONCURRENTLY`. It does not block writes but cannot run in a transaction block (many migration tools use one), is slow while CPUs are saturated, and a failure leaves an invalid index to drop. Make it UNIQUE only after checking that no two emails differ only by case, or the build fails.
  - **`citext` column:** the query returns to `email = $1`. Cost: an extension, and `ALTER ... TYPE` rewrites the table under an exclusive lock and rebuilds the unique index, failing on the same case duplicates.
  - **Normalised email column:** store the lower-cased value, index and query it. Cost: a backfill, and every write path must maintain it.
