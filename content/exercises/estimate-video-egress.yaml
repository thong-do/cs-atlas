slug: estimate-video-egress
type: estimate
title: "Estimate: on-demand video egress"
lessons: [estimation, dns-cdn]
ladderOrder: 5
scenario: |
  An on-demand video service with a large catalogue peaks at **1.5 million concurrent viewers**, spread across many titles. Each
  viewer watches a 1080p stream at **6 Mbit/s** on average.

  A CDN serves **98%** of the bytes from its edge caches. The remaining **2%** are misses, mostly on rarely watched titles, and are fetched from the origin.
  Use 8 bits per byte.
steps:
  - id: total-egress
    ask: "What total egress do the viewers pull at the peak?"
    unit: bits/s
    answer: 9000000000000
    work: "1.5 million × 6 Mbit/s = 9 million Mbit/s = 9 Tbit/s."
  - id: origin-egress
    ask: "Using the total egress, how much must the origin send at the 98% CDN byte hit ratio?"
    unit: bits/s
    answer: 180000000000
    work: "9 Tbit/s × 0.02 = 0.18 Tbit/s = 180 Gbit/s from the origin."
  - id: origin-bytes
    ask: "Using the origin egress, the origin's storage reads are measured in bytes. How many bytes per second must it serve?"
    unit: bytes/s
    answer: 22500000000
    work: "180 Gbit/s ÷ 8 = 22.5 GB/s."
takeaway: "The edge absorbs 98% of 9 Tbit/s, and since links are rated in bits and storage in bytes, you convert with the factor of 8. This scaling suits a large catalogue, where misses grow with traffic; one live stream is different, because its origin load follows the number of edges and bitrates, not viewers."
