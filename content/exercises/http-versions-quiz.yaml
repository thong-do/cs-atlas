slug: http-versions-quiz
type: quiz
title: "HTTP/1.1, HTTP/2 and HTTP/3 — quiz"
lessons: [http-versions]
ladderOrder: 1
questions:
  - id: quic-stream-loss
    prompt: "On an 80 ms RTT link, a page loads four streams, 4, 8, 12 and 16. One packet carrying only stream 4's data is lost; later packets carrying streams 8, 12 and 16 arrive intact and would otherwise complete within 10 ms. Assume the loss is repaired after about one RTT, 80 ms, over either protocol. You time each stream's completion over HTTP/2 and then over HTTP/3. What do you expect?"
    choices: ["HTTP/2: only stream 4 finishes about 80 ms late. HTTP/3: all four finish about 80 ms late", "HTTP/2: only stream 4 finishes about 80 ms late. HTTP/3: the same, because HTTP/2 frames carry stream ids and the HTTP layer reorders them", "HTTP/2: all four finish about 80 ms late. HTTP/3: only stream 4 does, while streams 8, 12 and 16 finish on time", "HTTP/2: all four finish about 80 ms late. HTTP/3: all four do as well, because QUIC also delivers data upward in a single connection-wide order"]
    answer: 2
    explanation: "Over HTTP/2 the kernel withholds the later TCP bytes until the gap is repaired, so every stream waits; QUIC delivers each stream independently, so only stream 4 waits. The first choice swaps the protocols, the second has the HTTP layer see bytes TCP has not yet delivered, and the last gives QUIC TCP's single ordering."
  - id: h1-h2-round-trips
    prompt: "A client fetches 40 small assets from one host at 50 ms RTT, ignoring bandwidth, server time and the congestion window. Over HTTP/1.1 it uses 8 parallel connections with one request in flight on each; over HTTP/2 it uses one connection and sends all 40 requests at once. Both are a first visit with no session ticket, so each does a full TLS 1.3 handshake on a new connection, and TCP setup counts as 1 RTT. What are the two completion times?"
    choices: ["HTTP/1.1 takes 300 ms and HTTP/2 takes 100 ms, because the 40 assets need 5 rounds of 8 and 1 round respectively, plus 1 RTT of setup", "HTTP/1.1 takes 450 ms and HTTP/2 takes 150 ms, because the 40 assets need 7 rounds of 6 and 1 round, plus 2 RTT of setup", "HTTP/1.1 takes 350 ms and HTTP/2 takes 100 ms, because the 40 assets need 5 rounds of 8, while HTTP/2 sends them with its handshake in 2 RTT", "HTTP/1.1 takes 350 ms and HTTP/2 takes 150 ms, because the 40 assets need 5 rounds of 8 and 1 round, plus 2 RTT of TCP and TLS setup"]
    answer: 3
    explanation: "HTTP/1.1: 2 setup + ⌈40 ÷ 8⌉ = 5 rounds = 7 RTT = 350 ms; HTTP/2: 2 setup + 1 round = 3 RTT = 150 ms. The first choice leaves out the TLS round trip, the second uses 6 connections although the stem says 8, and the third drops HTTP/2's request round, which cannot ride inside a full, non-resumed TLS 1.3 handshake."
  - id: wifi-to-cellular
    prompt: "A phone downloads a 600 MB file over HTTP/2 on wifi. The user walks out of range and the phone moves to cellular with a new IP address. The transfer stalls and restarts through a new TCP and TLS handshake. The same app over HTTP/3 pauses briefly and then carries on with the same connection. Which difference explains this?"
    choices: ["A TCP connection is its addresses and ports, so a new source IP is a new connection; a QUIC connection is identified by an ID that survives the address change", "The HTTP/3 client keeps a session ticket and so repeats a 0-RTT handshake to the new address, which costs no round trip at all, including for the transport", "QUIC keeps its congestion window per client address, so the new cellular address inherits the wifi sending rate, while TCP restarts from a small window", "HTTP/2 stream ids are tied to the client's IP address, while HTTP/3 stream ids are allocated independently of it, so streams can continue"]
    answer: 0
    explanation: "Identity is the difference: a changed address breaks a TCP connection but not a QUIC one with a connection ID. A ticket only shortens a handshake and still starts a new connection, a congestion window says how fast to send but not whether the connection survives (a new path generally has to be probed again), and stream ids never depended on IP addresses."
  - id: alt-svc-first-visit
    prompt: "A site's HTTP/2 responses carry `alt-svc: h3=\":443\"; ma=3600`, and its DNS has no HTTPS record. A user with an HTTP/3-capable browser and a network that passes UDP visits it for the first time, then reloads 10 minutes later. Which protocols carry the first load and the reload?"
    choices: ["Both over HTTP/3, because the browser lists h3 in the ALPN of its first TLS handshake and the server picks it when it supports it", "The first load over HTTP/2, since nothing had told the browser about HTTP/3, and the reload over HTTP/3, using the advertisement it stored", "Both over HTTP/2, because a browser acts on alt-svc only once its max-age has passed, so 3,600 seconds must expire before HTTP/3 is tried", "The first load over HTTP/3 and the reload over HTTP/2, because the header applies only to the connection that carried it, which has closed by the reload"]
    answer: 1
    explanation: "Alt-Svc is learned from a response, so the first visit uses HTTP/2, and the browser then remembers the offer for its max-age (3,600 s, longer than 10 minutes). ALPN runs inside TLS over TCP and cannot select QUIC, max-age is how long the offer stays valid rather than a delay, and the header describes the origin, not one connection."
  - id: large-download-no-gain
    prompt: "A team moves a CDN edge from HTTP/2 to HTTP/3. Clients on clean wired links each open a new connection and download one 4 GB file from a nearby cache, taking minutes. Measured throughput is unchanged. Why was no gain expected?"
    choices: ["QUIC's per-stream loss recovery falls back to retransmitting the whole connection's data when only one stream is active, which makes it as slow as TCP's recovery would be", "The handshake saving only applies to a connection that is already warm, and a download that starts the connection never benefits from it", "HTTP/3's main gain is that QPACK shrinks headers compared with HTTP/2, and a single download carries just one header block, so nothing is saved", "With one stream and almost no loss there is no blocking to remove, the saved handshake round trip is small against minutes of transfer, and the link sets the pace"]
    answer: 3
    explanation: "The wins are removing blocking after loss and a shorter handshake, and neither matters for one large transfer on a clean link. Per-stream recovery does not degrade with a single stream, the handshake saving applies to new connections rather than warm ones, and HPACK in HTTP/2 already compresses headers, so QPACK is not HTTP/3's main gain."
flashcards:
  - id: h1-blocking
    front: "HTTP/1.1 head-of-line blocking"
    back: "A response must finish before the next starts on a connection, so one slow response delays the rest. Browsers open about 6 connections per host; sharding, bundles and sprites worked around it."
  - id: h2-multiplexing
    front: "HTTP/2 streams and frames"
    back: "Messages are split into binary frames tagged with a stream id and interleaved on one TCP connection (multiplexing). Flow control works per stream; HPACK compresses headers."
  - id: h2-tcp-loss
    front: "HTTP/2 and packet loss"
    back: "It is one TCP connection delivering bytes in order, so one lost segment stalls every stream until it is retransmitted. HTTP-level blocking is gone; TCP-level blocking is not."
  - id: quic-handshake
    front: "QUIC handshake"
    back: "QUIC runs over UDP with TLS 1.3 built in, so the transport and crypto handshake together take 1 RTT for a new connection, plus 0-RTT early data on resumption (replayable)."
  - id: quic-streams
    front: "QUIC loss and congestion"
    back: "Loss recovery is per stream, so a lost packet delays only the streams whose data it carried. Congestion control is shared by the whole connection."
  - id: conn-migration
    front: "Connection migration"
    back: "A QUIC connection is identified by a connection ID, not the addresses and ports, so it can continue when the client changes network, for example from wifi to cellular."
  - id: alt-svc
    front: "Alt-Svc and fallback"
    back: "A server advertises HTTP/3 with an Alt-Svc header (DNS HTTPS records can also do it). If UDP is blocked, the client falls back to HTTP/2 over TCP."
  - id: h3-no-help
    front: "When HTTP/3 does not help"
    back: "A single large download on a clean network: no blocking to remove, and the handshake saving is small against the transfer. It helps most on lossy or changing networks."
