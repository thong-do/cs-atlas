slug: linked-list-quiz
type: quiz
title: "Linked List — quiz"
lessons: [linked-list]
ladderOrder: 0
questions:
  - id: middle-loop-variant
    prompt: "A teammate changes the loop in `middle` to `while fast.next and fast.next.next`. Which value does the node it returns hold for `1 → 2 → 3 → 4 → 5 → 6`?"
    choices: ["2", "3", "4", "5"]
    answer: 1
    explanation: "`fast` visits 1, 3 and 5. At 5, `fast.next.next` is None, so the loop stops with `slow` on 3. The template's loop goes one step further and returns 4, so on even lengths the two loops pick different middles."
  - id: reverse-lost-link
    prompt: "A teammate writes the reversal as `curr.next = prev`, then `prev = curr`, then `curr = curr.next`, inside `while curr`, and returns `prev`. What list comes back for `1 → 2 → 3`?"
    choices: ["1", "3 → 2 → 1", "1 → 2 → 3", "3"]
    answer: 0
    explanation: "The first line overwrites the only link to node 2, so `curr = curr.next` reads the new None and the loop ends after one pass. `prev` is node 1, alone. Saving the next node first fixes it, and so does the template's single tuple assignment."
  - id: delete-without-dummy
    prompt: "This removes all nodes with value v: `curr = head`, then `while curr and curr.next:` with `if curr.next.val == v: curr.next = curr.next.next` and `else: curr = curr.next`, then `return head`. What does it return for `7 → 7 → 3 → 7` with v = 7?"
    choices: ["3", "An empty list", "7 → 3 → 7", "7 → 3"]
    answer: 3
    explanation: "It only ever tests `curr.next`, so the head is never tested and stays. The other two 7s are removed. A dummy node in front of the head gives every real node a predecessor, and the same code then returns just 3."
  - id: repeated-walk-cost
    prompt: "A report prints a 10,000-node list by calling `get(i)` for each i from 0 to 9,999, where `get(i)` walks i hops from the head. About how many hops is that in all?"
    choices: ["About 10,000", "About 20,000", "About 50,000,000", "About 100,000,000"]
    answer: 2
    explanation: "The hops are 0 + 1 + … + 9,999 = 49,995,000, which is O(n²). Keeping a reference to the current node would take one walk of about 10,000 hops."
  - id: floyd-meeting-point
    prompt: "A list has 3 nodes before its loop begins, and the loop has 4 nodes. `slow` and `fast` both start at the head, moving 1 and 2 hops per step. After how many steps do they first meet?"
    choices: ["4", "3", "7", "12"]
    answer: 0
    explanation: "After 3 steps, `slow` has just entered the loop and `fast` has gone 6 hops, 3 into the loop, which puts it 1 hop behind `slow` going round. The gap closes by one per step, so they meet after step 4. That fits the lesson: `slow` has walked 4, a multiple of the loop length."
flashcards:
  - id: when-to-use
    front: "When is a linked list the right tool?"
    back: "When you hold a node and need O(1) insert or remove right there, as in an LRU cache. For indexing, a Python list is better."
  - id: access-cost
    front: "Reaching position i"
    back: "i hops from the head, so O(n). Walking from the head inside a loop makes the loop O(n²)."
  - id: dummy
    front: "Why use a dummy node?"
    back: "It gives every real node a predecessor, so changing the head needs no special case. Return `dummy.next`, not `dummy`."
  - id: reversal-steps
    front: "In-place reversal: the order of moves"
    back: "Save curr.next, point curr.next at prev, move prev to curr, move curr to the saved node. Return prev. O(n) time, O(1) extra."
  - id: fast-slow-middle
    front: "Finding the middle"
    back: "`fast` moves two hops per one of `slow`, on `while fast and fast.next`. When `fast` ends, `slow` is halfway."
  - id: cycle-detect
    front: "Why must fast and slow meet in a cycle?"
    back: "Once both are in the loop, the gap between them changes by one node per step, so it reaches zero. If `fast` hits None, there's no loop."
  - id: floyd-start
    front: "Floyd: finding the cycle's start"
    back: "After they meet, restart one at the head and move both one hop at a time. They meet at the start, as a + b is a multiple of the loop length."
  - id: lost-rest
    front: "The classic rewiring bug"
    back: "Overwriting curr.next before saving it loses the rest of the list. Save the next node first."
