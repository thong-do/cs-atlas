slug: memory-hierarchy-quiz
type: quiz
title: "The memory hierarchy — quiz"
lessons: [memory-hierarchy]
ladderOrder: 1
questions:
  - id: split-the-record
    prompt: "A C program keeps 1,000,000 records in one array, each a `struct { double price; double qty; double tax; }` of 24 bytes with no gaps, and sums only `price`. Cache lines are 64 bytes and the array is far larger than every cache. A teammate splits it into three separate `double` arrays and sums the `price` array. About how many cache lines does the sum load before and after?"
    choices: ["About 1,000,000 before and 1,000,000 after: a sum is one load per element, so the line count equals the element count in either layout", "About 1,000,000 before and 125,000 after: each record's price sits in a different line, so every record costs a full line fetch", "About 375,000 before and 125,000 after: the 24 MB array streams through the cache either way, but the price array alone is 8 MB", "About 125,000 before and after: the hardware loads only the 8 bytes the loop reads, so the layout changes nothing"]
    answer: 2
    explanation: "A line holds 64 bytes whatever the loop needs, so the sum fetches the whole 24 MB array, 24,000,000 ÷ 64 = 375,000 lines, and then the 8 MB price array, 8,000,000 ÷ 64 = 125,000. The other choices count one fetch per element, one line per record (a line holds more than two records), or fetch only the bytes read."
  - id: independent-misses
    prompt: "C on a machine with 8 MB of L3 and about 90 ns DRAM latency. Three O(n) loops each read 10,000,000 ints from a 40 MB array. Loop A reads it in order and takes 10 ms. Loop B reads `a[idx[i]]`, where `idx` holds a precomputed random permutation, and takes 150 ms. Loop C follows `p = a[p]` through the same random order and takes 900 ms. B averages 15 ns per element, far below a 90 ns DRAM trip. What best explains B?"
    choices: ["B's addresses come from `idx`, not from earlier loads, so the CPU can have several misses in flight at once, while C waits out 90 ns each", "The prefetcher learns the permutation during the pass, so most of B's data is already in L1 by the time each read happens", "Each 64-byte line holds 16 ints, so one miss serves the next 15 reads of that line, and B misses on only about one read in 16", "Reading `idx` in order is prefetched, and each line of `idx` brings in the matching lines of `a`, so B pays DRAM latency for only a few reads"]
    answer: 0
    explanation: "B and C miss about equally often, but B's loads do not depend on each other, so their ~90 ns waits overlap, while C's wait one after another: 10,000,000 × 90 ns = 900 ms. The other choices reuse a line that random order has long evicted (40 MB against 8 MB of L3), a prefetcher that cannot learn a one-pass random order, and prefetched `idx` lines that never contain `a`."
  - id: increment-traffic
    prompt: "C on a CPU with write-back caches: a store marks the cached line dirty, a dirty line is written to memory only when it is evicted, and a store to an uncached line loads the line first. An array of 256 MiB of 4-byte ints is far larger than every cache. Loop 1 sums every element. Loop 2 runs `a[i] += 1` over every element, in order. Compared with loop 1, how much memory traffic does loop 2 cause?"
    choices: ["About the same: the increments land in the cache and the dirty lines stay there, so memory only sees the 256 MiB of reads", "About 1.06 times: memory sees the 256 MiB of reads plus only the changed bytes, 4 of every 64, which is 256 MiB ÷ 16", "About three times: each line is read in, written back dirty, and read in again because eviction removes it before the next element needs it", "About twice: each line is read in once and later evicted dirty, so memory sees 256 MiB of reads and 256 MiB of writes, 512 MiB in all"]
    answer: 3
    explanation: "Every line is modified and the array cannot stay cached, so every line is read once and written back whole once: 256 + 256 = 512 MiB. The other choices keep dirty lines in a cache that is too small, write only changed bytes (the whole line goes), or reload lines that in-order access still needs."
  - id: page-cache-average
    prompt: "A service reads 4 KiB records from a file on NVMe, choosing records uniformly at random. A read that goes to the device takes 80 µs. The operating system keeps 25% of the file's records in RAM, where a read takes 0.1 µs. Reads are one at a time. What is the mean latency per read, to the nearest 5 µs?"
    choices: ["20 µs: keeping a quarter of the file in RAM cuts the device latency to a quarter, 80 µs × 0.25", "60 µs: three reads in four go to the device, so the mean is 0.75 × 80 + 0.25 × 0.1 ≈ 60 µs", "40 µs: the two levels share the reads, so the mean is about half of 80 µs plus 0.1 µs", "80 µs: random reads have no locality, so the RAM copy of the file is never the one that is read"]
    answer: 1
    explanation: "Uniform random reads hit the cached 25% a quarter of the time, so the mean is 0.75 × 80 + 0.25 × 0.1 = 60.025 µs; the slow level still dominates. The other choices scale the device time by the hit rate, average the two latencies as if reads split evenly, or assume random access cannot hit a cache that holds a quarter of the data."
  - id: two-passes-thrash
    prompt: "A C program streams in order over an int array and repeats the whole pass 10 times. The CPU has a 32 MiB L3 with least-recently-used eviction. Over a 24 MiB array, each pass after the first takes 4 ms. Over a 48 MiB array, each pass takes 20 ms, 5 times longer for twice the data. What explains the jump?"
    choices: ["The 48 MiB array has twice as many lines, so each pass pays twice as many first-touch misses, and the rest of the gap is noise", "Each pass leaves the least recently used 16 MiB behind, so about two thirds of the lines hit and a third miss, a blend of 4 ms and 20 ms", "A 48 MiB array is not a power of two, so many of its lines map to the same cache slots and evict each other, though L3 has room", "Before a line is read again, the pass has read 48 MiB of other lines, more than L3 holds, so every one is evicted and goes to DRAM"]
    answer: 3
    explanation: "With in-order passes and LRU eviction, a line comes back after about 48 MiB of other lines, so it is evicted every time and each pass streams from DRAM; the 24 MiB array fits and later passes hit L3. The other choices count first touches (only the first pass), imagine a cache that keeps two thirds of a cyclic scan, or blame a power-of-two mapping effect the stem gives no sign of."
flashcards:
  - id: latency-ladder
    front: "Order of magnitude of the latency ladder"
    back: "Illustrative: L1 ~1 ns, L2 a few ns, L3 ~10-40 ns, DRAM ~100 ns, NVMe ~10-100 µs, spinning disk ~10 ms. Varies by CPU and device."
  - id: human-scale-ladder
    front: "Latency ladder in human time"
    back: "Scale 1 ns to 1 s: DRAM at 100 ns becomes 100 s, about 1.7 minutes; NVMe at 50 µs becomes about 14 hours; a 10 ms disk seek about 116 days."
  - id: cache-line
    front: "What is a cache line?"
    back: "The unit a cache moves, typically 64 bytes on x86-64 and many ARM cores. Touching one byte fetches the whole line, so neighbours come free."
  - id: spatial-temporal-locality
    front: "Spatial vs temporal locality"
    back: "Spatial: you soon touch addresses near one just used. Temporal: you soon touch the same address again. Caches and lines are built to reward both."
  - id: three-miss-kinds
    front: "Compulsory, capacity and conflict misses"
    back: "Compulsory: first touch. Capacity: working set exceeds the cache. Conflict: lines map to the same slots and evict each other though the cache has room."
  - id: write-back-cache
    front: "What does a write-back cache do on a store?"
    back: "It updates the cached line and marks it dirty, writing it to the next level only when it is evicted. A store to an uncached line usually loads it first."
  - id: aos-vs-soa
    front: "Array of structs vs struct of arrays"
    back: "AoS keeps each record's fields together; SoA keeps each field in its own array. Scanning one field is far lighter on cache lines with SoA."
  - id: same-bigo-different-speed
    front: "Why can two O(n) loops differ 10x?"
    back: "Big-O drops constants. Sequential reads stream whole lines with prefetching; scattered or pointer-chased reads can pay a DRAM trip per element."
