slug: number-representation-quiz
type: quiz
title: "Number representation — quiz"
lessons: [number-representation]
ladderOrder: 1
questions:
  - id: narrowing-cast
    prompt: "In Java, `int x = 200; byte b = (byte) x;`. A narrowing cast keeps only the low 8 bits of the int, and `byte` is a signed 8-bit type. What does `b` hold?"
    choices: ["-56: the top bit of 11001000 has weight −128, so the value is −128 + 64 + 8 = −56, same as 200 − 256", "-72: the top bit is only a minus sign in front of the remaining seven bits, 1001000, which is 72", "-55: the top bit marks a negative number, and the other seven bits are then inverted: 0110111, which is 55", "72: a signed read subtracts 128 from any unsigned value above 127, and 200 − 128 leaves 72 for 11001000"]
    answer: 0
    explanation: "In two's complement the top bit counts −128, so 11001000 is −128 + 64 + 8 = −56. The other choices treat the top bit as a separate sign flag (−72), read the pattern in ones' complement (−55), or subtract 128 instead of 256 (72)."
  - id: wrapped-deadline
    prompt: "A C timer loop on a microcontroller uses `uint32_t deadline = millis() + 1000; while (millis() < deadline) { }`, where `millis()` returns milliseconds since boot as a `uint32_t`. The call to `millis()` that sets the deadline returns 4,294,966,800 (2^32 is 4,294,967,296). What does the loop do?"
    choices: ["It waits about 1,000 ms: the sum is exact, so the deadline is 4,294,967,800 and the loop runs until the counter reaches it", "It waits about 49.7 days: the deadline is 504, so the counter must wrap to 0 and climb to 504 before the loop ends", "It is undefined behaviour: the compiler may assume the addition cannot overflow, so the loop can be removed or spin forever", "It returns at once: the deadline wraps to 504, so `millis() < deadline` is already false and the delay never happens"]
    answer: 3
    explanation: "4,294,966,800 + 1,000 = 4,294,967,800, and subtracting 2^32 leaves 504, a deadline far below the current count. The other choices keep a 33-bit sum in a 32-bit variable, wait for the counter to reach 504 when the loop condition is already false, or apply the signed-overflow rule to unsigned arithmetic."
  - id: exact-equality-test
    prompt: "A Python test suite asserts exact `==` on float arithmetic in IEEE 754 doubles, and one assertion is reliable on every machine while the others fail. Which one passes?"
    choices: ["`0.1 * 3 == 0.3`, because multiplying by a whole number is exact while only repeated addition accumulates error", "`1.1 * 1.1 == 1.21`, because the product of two decimals with one digit after the point has two, far inside 15 digits of precision", "`0.125 + 0.375 == 0.5`, because 1/8, 3/8 and 1/2 are sums of powers of two, so each is stored exactly, with no rounding", "`0.7 + 0.1 == 0.8`, because every operand and the result have a single decimal digit, so the rounding errors cancel"]
    answer: 2
    explanation: "1/8, 3/8 and 1/2 have power-of-two denominators, so they are stored exactly and so is their sum. The others involve 0.1, 0.3, 0.7, 0.8 or 1.1, none exactly representable, and in Python they evaluate to 0.30000000000000004, 1.2100000000000002 and 0.7999999999999999 on the left, so each assertion fails."
  - id: abs-of-min-value
    prompt: "A Java router picks `int shard = Math.abs(key.hashCode()) % 15;`. In Java, `Math.abs` takes and returns an `int`, and `%` gives a result with the sign of its left operand. One key hashes to exactly −2,147,483,648. What does `shard` hold?"
    choices: ["-8: 2,147,483,648 does not fit in an `int`, so `abs` returns −2,147,483,648 unchanged and `%` keeps its sign", "0: `abs` clears the sign bit of 10000000…0, leaving all zeros, and 0 % 15 is 0, so the remainder is a valid index", "7: `abs` saturates at 2,147,483,647, the largest `int`, and that leaves remainder 7 when divided by 15", "An `ArithmeticException`: `abs` detects that the positive result does not fit in an `int` and throws before the `%` runs"]
    answer: 0
    explanation: "int32 has no +2,147,483,648, so `Math.abs` returns the same negative value, and −2,147,483,648 % 15 = −8 in Java, an invalid shard index. The other choices clear the sign bit to get 0 (that does not negate a two's complement value), clamp to the maximum (7), or expect an exception that `Math.abs` does not throw."
  - id: absolute-tolerance
    prompt: "In Python, two measured currents are `a = 3.2e-12` and `b = 3.1e-12`, 3% apart. A test `abs(a - b) < 1e-9` passes, and the team is puzzled because the values clearly differ. Why does it pass?"
    choices: ["Doubles near 3e-12 keep only a few reliable digits, so `a` and `b` are stored as the same number and the difference is 0.0", "The cutoff 1e-9 is over 300 times larger than the values, so any two numbers this small pass; a relative check scales with them", "Subtracting two nearly equal doubles cancels almost every digit, so the difference is rounding noise under 1e-9 by chance", "Values near 3e-12 are subnormal doubles, which compare with reduced precision, so `<` treats them as equal within 1e-9"]
    answer: 1
    explanation: "The difference is about 1e-13, far under the 1e-9 cutoff, which is over 300 times the size of a and b, so the check cannot tell them apart. The other choices claim the doubles collapse into one value (they keep about 15 digits at any magnitude), blame cancellation (the subtraction is accurate here), or call 3e-12 subnormal (subnormals start far below, near 1e-308)."
flashcards:
  - id: positional-notation
    front: "How do you read 0b1011 and 0xFF?"
    back: "Each digit is weighted by a power of the base. 0b1011 = 8 + 2 + 1 = 11. 0xFF = 15 × 16 + 15 = 255. One hex digit is exactly 4 bits."
  - id: unsigned-range
    front: "Range of an unsigned n-bit integer"
    back: "0 … 2^n − 1, since n bits give 2^n patterns. 8 bits: 0 … 255. 32 bits: 0 … 4,294,967,295."
  - id: twos-complement-negate
    front: "How is -x formed in two's complement?"
    back: "Invert every bit and add 1. For 8 bits, 5 = 00000101 becomes 11111010, then 11111011, which is -5. The top bit has weight -2^(n-1)."
  - id: twos-complement-range
    front: "Signed n-bit range and why it is asymmetric"
    back: "-2^(n-1) … 2^(n-1) - 1; int32 is -2,147,483,648 … 2,147,483,647. There is one zero, and it takes a slot from the positive side."
  - id: overflow-by-language
    front: "What happens when an int overflows, by language?"
    back: "C: signed is undefined behaviour, unsigned wraps mod 2^n. Java: int wraps. Python: unbounded. Rust: panics in debug, wraps in release by default."
  - id: double-layout
    front: "Layout of an IEEE 754 double"
    back: "1 sign bit, 11 exponent bits, 52 fraction bits, plus an implicit leading 1: 53 significant bits, about 15-17 decimal digits."
  - id: point-one-plus-point-two
    front: "Why is 0.1 + 0.2 != 0.3 in a double?"
    back: "1/10 has a factor of 5 in its denominator, so it has no finite binary expansion. The nearest doubles are slightly off; Python prints 0.30000000000000004."
  - id: money-in-code
    front: "How should code represent money?"
    back: "Integer minor units (cents) or a decimal type (Decimal, BigDecimal), rounding only at defined points with a stated rule. Not binary floats."
