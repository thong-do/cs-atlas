slug: observability-quiz
type: quiz
title: "Observability — quiz"
lessons: [observability]
ladderOrder: 1
questions:
  - id: fleet-p95
    prompt: "Three API hosts report p95 latencies of 80 ms, 90 ms and 400 ms. The third host serves far fewer requests. How should the dashboard show the fleet-wide p95?"
    choices: ["Export histograms with shared buckets from each host, sum the counts, then estimate the p95 from the sums", "Average the three p95 values, weighted by each host's request count, since busier hosts matter more to users", "Take the largest of the three host p95 values, because the fleet is only as fast as its slowest host is", "Take the median of the three p95 values, which discards the one outlier host and its small traffic share"]
    answer: 0
    explanation: "A percentile cannot be rebuilt from other percentiles: the maximum is only an upper bound, and the average and median have no fixed relation to the fleet p95. Histograms add across hosts, and the estimate is limited by bucket boundaries."
  - id: error-budget-size
    prompt: "A service has an SLO of 99.5% of requests succeeding over a rolling 14 days. About how many minutes of total outage does the error budget allow?"
    choices: ["About 201.6 minutes, which is 0.01 of the 20,160 minutes in the window as a whole", "About 10.1 minutes, which is 0.0005 of the 20,160 minutes in the window", "About 100.8 minutes, which is 0.005 of the 20,160 minutes in the window", "About 40.3 minutes, which is 0.002 of the 20,160 minutes in the window"]
    answer: 2
    explanation: "The window is 14 × 24 × 60 = 20,160 minutes and the allowed failure share is 1 − 0.995 = 0.005, giving 100.8 minutes. The other choices use a different failure share."
  - id: burn-rate-reading
    prompt: "An API has a 99.9% SLO over 30 days. Since a bad deploy, 0.5% of requests have been failing steadily. If nothing changes, roughly when is the whole budget gone?"
    choices: ["After about 5 days, because the burn rate is 0.5% ÷ 0.1% = 5 and so the budget lasts 5 days", "After about 15 days, because the 0.5% failure rate is half of an assumed 1% error allowance", "After about 6 days, since the burn rate is 0.5% ÷ 0.1% = 5 and 30 ÷ 5 = 6 days of it left", "After about 3 days, since the 0.5% failures burn it ten times too fast and 30 ÷ 10 = 3"]
    answer: 2
    explanation: "The budget is 0.1% of requests; failing at 0.5% burns it 5 times faster than the sustainable rate, so it lasts a fifth of the window: 30 ÷ 5 = 6 days. Multiplying by 5 would lengthen the time, but a higher burn shortens it. Reading the burn rate of 5 as 5 days confuses a rate with a duration. The 15-day choice invents a 1% allowance that the SLO does not set. Dividing by 10 uses a burn rate of 10, but 0.5% ÷ 0.1% is 5."
  - id: label-choice
    prompt: "A team wants per-endpoint request metrics for an API with routes like /orders/8841 and /orders/9027. Which label choice keeps the number of series bounded?"
    choices: ["Label by the raw request path, and let the metrics store drop the oldest series when it fills", "Label by the route template /orders/{id}, plus method and status class, with ids in logs", "Label by a hash of the full path, so each label value stays a short fixed-length string", "Label by the raw path, but only for requests slower than the SLO threshold"]
    answer: 1
    explanation: "A template has one value per route, so series stay a small product of a few labels. Hashing shortens a value but keeps one value per id, and filtering to slow requests still lets ids pile up."
  - id: keep-error-traces
    prompt: "A team traces 1% of requests chosen when each request arrives, but nearly every trace they need for outages was discarded. What change targets the problem?"
    choices: ["Sample by a hash of the trace id so every span of a trace is kept or dropped together, at 1%", "Mark spans as errors in the service code, which makes head sampling retroactively keep them", "Add tail sampling in a collector that buffers each trace and keeps errors and slow ones", "Raise the head sampling rate to 5%, so most failing traces are now kept"]
    answer: 2
    explanation: "A decision made at the start cannot know the outcome, so hashing the trace id, tagging errors later or changing the rate only changes how many random traces survive. Tail sampling decides after completion, at the cost of buffering and routing a trace's spans to one place."
flashcards:
  - id: three-signals
    front: "Metrics, logs and traces"
    back: "Metrics: cheap aggregates, show that something is wrong. Logs: structured events with a trace id. Traces: a request's path as spans, show where time went."
  - id: red-method
    front: "RED method"
    back: "For services: Rate, Errors, Duration. Popularised by Tom Wilkie. Describes what users of a service experience."
  - id: use-method
    front: "USE method"
    back: "For resources: Utilization, Saturation, Errors. From Brendan Gregg. Explains why a disk, queue or pool is struggling."
  - id: percentile-merge
    front: "Merging percentiles across hosts"
    back: "You cannot average p99s. Export histograms, add bucket counts across hosts, then estimate the percentile; bucket boundaries bound accuracy."
  - id: error-budget
    front: "Error budget"
    back: "1 minus the SLO. 99.9% over 30 days: 43,200 min x 0.001 = 43.2 minutes of full outage, or the same share of failed requests."
  - id: burn-rate
    front: "Burn rate"
    back: "Speed of budget use relative to the SLO. 1 spends it exactly over the window; 10 spends a 30-day budget in 3 days. Fast burn pages, slow burn tickets."
  - id: cardinality
    front: "Metric cardinality"
    back: "Series = product of each label's distinct values. 4 methods x 50 routes x 5 statuses = 1,000. A 100,000-value id label multiplies that by 100,000."
  - id: head-vs-tail
    front: "Head vs tail sampling"
    back: "Head decides at request start: cheap, blind to outcome. Tail decides after the trace completes, keeping errors and slow traces, but needs buffering."
