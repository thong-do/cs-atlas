slug: video-streaming-quiz
type: quiz
title: "Video streaming — quiz"
lessons: [video-streaming]
ladderOrder: 1
questions:
  - id: stall-length
    prompt: "A player's ladder is 300, 800, 1,800 and 3,500 kbps with 6 s segments. It has 5 s buffered and starts fetching a segment at 1,800 kbps, but bandwidth drops to 1 Mbit/s for the whole download. Playback keeps draining the buffer meanwhile. How long does playback stall? Like the lesson's animation, it plays a segment only once all of it has arrived."
    choices: ["None: the segment is 1,350 kB, which arrives in 1.35 s at 1 Mbit/s, well within the 5 s buffer", "4.8 s: the 10.8 s download minus the 6 s of video that the segment holds", "10.8 s: playback cannot use the buffer while a download is in flight, so it waits for all of it", "5.8 s: 10,800 kbit takes 10.8 s at 1 Mbit/s, and the buffer covers 5 s of that"]
    answer: 3
    explanation: "The segment is 1,800 kbps × 6 s = 10,800 kbit (1,350 kB), which takes 10.8 s at 1,000 kbit/s, and the buffer runs out after 5 s, so playback waits 5.8 s. Dividing kilobytes by a bit rate gives the false 1.35 s, the segment's own 6 s cannot play until it arrives, and the buffer keeps playing during a download."
  - id: release-misses
    prompt: "A newly released video becomes popular within minutes. The CDN has about 250 edge locations, and origin logs showed each new segment requested about 250 times in its first minute. The team adds an origin shield in each of the CDN's 5 regions; every edge sends its misses to its own region's shield, and a shield collapses simultaneous misses for one object into a single fetch. About how many origin requests should each new segment now cause in its first minute?"
    choices: ["About 1: the five shields form one shared cache, so only the first miss anywhere reaches the origin", "About 250: shields collapse only simultaneous misses, and these misses are spread over a whole minute", "About 5: each regional shield misses once, then serves the segment from its cache to the edges behind it", "About 245: only edges sharing a data centre with a shield stop missing; all the others still go to the origin"]
    answer: 2
    explanation: "Each shield fetches the segment once and then answers later misses from its region's edges from its own cache, so the origin sees about 5 requests. Regional shields do not share one cache, a shield's cache also serves misses that arrive later, and every edge's misses go to a shield, not only those of co-located edges."
  - id: resume-conflict
    prompt: "A viewer pauses a film on a phone at 40:00, then finishes it on a TV, which saves 1:52:00. The phone was offline and, an hour later, uploads a queued resume write for 40:00. Every write carries the time the player recorded it. Viewers sometimes rewind on purpose, and resume should show where they really stopped. Which rule handles both cases?"
    choices: ["Keep the larger position, since a viewer rarely means to go backwards in a film", "Keep the write with the latest recorded time, so the queued 40:00 write is ignored", "Keep the write that arrives last, since the server's clock is the only trustworthy one", "Keep one position per device, and resume each device from its own last saved point"]
    answer: 1
    explanation: "Ordering by when the player recorded the position rejects the late phone write and still lets a deliberate rewind win, assuming device clocks are roughly right. The largest position ignores rewinds, arrival order lets the stale write overwrite 1:52:00, and per-device positions would resume the phone at 40:00."
  - id: chunk-waves
    prompt: "A 60-minute upload is split into 2-minute chunks and encoded into 4 renditions, one task per chunk and rendition. Each task takes 3 minutes, and 40 idle workers each run one task at a time. Ignoring packaging and queue overhead, how long until every rendition is encoded?"
    choices: ["3 minutes: every chunk of every rendition is independent, so all of them run at once", "90 minutes: a rendition's 30 chunks must be encoded in order, at 3 minutes each", "12 minutes: the 4 renditions run one after another, each taking 3 minutes on the workers", "9 minutes: 30 chunks × 4 renditions = 120 tasks, which run in 3 waves of 40 workers"]
    answer: 3
    explanation: "There are 120 independent tasks and 40 workers, so 3 waves of 3 minutes each. All-at-once needs 120 workers, chunks do not depend on each other, and nothing forces renditions to wait for one another."
  - id: hit-ratio-gain
    prompt: "A platform delivers 8 Tbit/s at peak. After fixing its cache keys, the CDN's byte hit ratio rises from 90% to 96%. What happens to the traffic that misses the edges at peak?"
    choices: ["It falls from 800 to 320 Gbit/s, a 60% cut, though hit ratio rose by 6 points", "It falls by about 6.7%, from 800 to about 747 Gbit/s, as 6 points on 90 is 6.7%", "It halves from 800 to 400 Gbit/s, because the miss share goes from 8% to 4%", "It falls by 6%, from 800 to 752 Gbit/s, removing 6% of the traffic that missed"]
    answer: 0
    explanation: "Misses are 10% of 8 Tbit/s = 800 Gbit/s before and 4% = 320 Gbit/s after, a 60% cut. The other choices scale the old misses by the relative or absolute change in hit ratio, or start from the wrong miss share."
flashcards:
  - id: vs-abr
    front: "Adaptive bitrate (ABR) streaming"
    back: "The video is encoded at several bitrates and cut into short segments. The player picks a rendition per segment from measured throughput and, in many real players, its buffer level."
  - id: vs-rendition-ladder
    front: "Rendition ladder"
    back: "The set of encodings of one video at different bitrates and resolutions, such as 400 to 5,000 kbps. More rungs smooth switching but cost encoding and storage."
  - id: vs-hls-dash
    front: "HLS vs DASH manifests"
    back: "HLS uses .m3u8 playlists: a multivariant one listing renditions and one per rendition listing segments. DASH describes the same in an XML MPD file."
  - id: vs-cmaf
    front: "CMAF segments"
    back: "A standard fragmented-MP4 segment format that both HLS and DASH can reference, so one set of segments can often serve both. Device and DRM support vary."
  - id: vs-presigned-upload
    front: "Pre-signed upload URL"
    back: "A short-lived link the API hands out so the client writes straight to the object store. API servers never carry video bytes; multipart uploads resume after drops."
  - id: vs-chunked-transcode
    front: "Chunked parallel transcoding"
    back: "Split the source at keyframes and encode each chunk × rendition as its own queue task, writing to a deterministic key so a retried task is idempotent."
  - id: vs-origin-shield
    front: "Origin shield"
    back: "A mid-tier cache between CDN edges and the origin. Misses from many edges collapse into one origin fetch, which matters when a new video gets popular fast."
  - id: vs-segment-caching
    front: "Cache lifetimes for video segments and playlists"
    back: "Segments never change, so cache them for a long time and use new paths for a new encode. Playlists that gain renditions get a short lifetime."
